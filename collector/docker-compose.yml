services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${PGPASSWORD:-fleet}
      POSTGRES_DB: fleet
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build: .
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: fleet
      PGPASSWORD: ${PGPASSWORD:-fleet}
      PGDATABASE: fleet
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["node", "src/index.js", "schedule"]

  api:
    build: .
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: fleet
      PGPASSWORD: ${PGPASSWORD:-fleet}
      PGDATABASE: fleet
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    command: ["node", "api/server.js"]

volumes:
  pgdata:
