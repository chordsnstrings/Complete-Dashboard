<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Installable, and dark before the first paint: a home-screen app that
     flashes linen and then goes dark reads as a web page in a costume. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14171a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fleet">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png" type="image/png">

<!-- Which of the two applications this is.
     ─────────────────────────────────────────────────────────────────────
     The phone build is not the desktop one reflowed: it is a different set
     of screens with a different shape, and loading both would mean shipping
     each reader the one they cannot use. The choice is made HERE, before any
     stylesheet or module is requested, so nothing is downloaded twice and
     there is no flash of the wrong app.

     Coarse pointer AND a narrow viewport, so a touchscreen laptop and a
     narrow desktop window both stay on the desktop build — the phone build
     assumes a thumb, and a mouse user in a small window wants the real thing.
     ?ui=phone / ?ui=desktop overrides it and is remembered, which is also how
     the phone build is opened on a desktop to work on it. -->
<script>
(function () {
  var q = new URLSearchParams(location.search).get('ui');
  try {
    if (q === 'phone' || q === 'desktop') localStorage.setItem('ui', q);
    else if (q === 'auto') localStorage.removeItem('ui');
  } catch (e) { /* private mode: the choice just does not stick */ }
  var saved = null;
  try { saved = localStorage.getItem('ui'); } catch (e) { /* as above */ }
  var pick = q || saved;
  var phone = pick ? pick === 'phone'
    : matchMedia('(max-width: 760px)').matches && matchMedia('(pointer: coarse)').matches;
  var r = document.documentElement;
  r.dataset.ui = phone ? 'phone' : 'desktop';
  if (phone) {
    /* The theme, before the stylesheet — same key the desktop button writes,
       so a reader who set light on their laptop gets light here too. */
    try {
      var t = localStorage.getItem('theme');
      if (t) r.setAttribute('data-theme', t);
    } catch (e) { /* default to the OS preference */ }
    var css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = '/m/m.css';
    document.head.appendChild(css);
  }
  var js = document.createElement('script');
  js.type = 'module'; js.src = phone ? '/m/app.js' : '/app.js';
  document.head.appendChild(js);
}());
</script>
<!-- Fonts served from this origin. From fonts.googleapis.com a cold visit paid
     two DNS lookups and two TLS handshakes to a third party before the stylesheet
     naming the files could be read, then two more before the files arrived — the
     largest fixed delay left in a first paint on a phone, and none of it work.
     See fonts.css. -->
<link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/karla-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="brand"><span class="dot"></span><b>Fleet</b>Dashboard</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button id="themeBtn" title="Toggle theme">◐ theme</button>
      <!-- An address, not a paragraph. This block is where a reader learns a
           collector is behind, and the page that says which one and why was one
           click away with no way to take it. -->
      <a id="freshness" class="fresh" href="#sources" title="Collector health, coverage and history depth">—</a>
    </div>
  </aside>

  <main class="main">
    <!-- Above the title, not inside a panel. A credential that has stopped
         makes every number below it stale, so it cannot sit in the page's
         content where a view can replace it or a reader can scroll past it.
         Filled by authBanner() in app.js on every render; empty and unstyled
         until there is something true to say. -->
    <div id="authBanner" role="status" aria-live="polite"></div>
    <header class="topbar">
      <div>
        <nav id="crumb" class="crumb" style="display:none"></nav>
        <h1 id="viewTitle">Unit economics</h1>
        <p id="viewSub" class="sub">What every vehicle and every driver earned per day worked, per km and per booking</p>
      </div>
      <div class="filters" id="filters">
        <!-- 180 is here because the router accepts it (api/public/data.js) and
             the repo's own smoke list links to it. Without the option a
             ?days=180 address left the control with selectedIndex -1 — blank —
             while the page genuinely used six months. -->
        <!-- Two kinds of window, and they answer different questions. A rolling
             one ("last 30 days") is the right frame for a trend; a calendar
             period is the right frame for "how is August going", which a
             thirty-day window straddling two months cannot answer. Both are
             here, grouped so the difference is visible rather than implied. -->
        <select id="fRange" title="Date range">
          <optgroup label="Calendar period">
            <option value="p:today">Today</option>
            <option value="p:yesterday">Yesterday</option>
            <option value="p:week">This week</option>
            <option value="p:month">This month</option>
            <option value="p:last_week">Last week</option>
            <option value="p:last_month">Last month</option>
            <option value="p:quarter">This quarter</option>
            <option value="p:year">This year</option>
          </optgroup>
          <optgroup label="Rolling window">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="180">Last 6 months</option>
            <option value="365">Last 12 months</option>
          </optgroup>
        </select>
        <!-- How the window is BUCKETED, which is not how long it is. Left on
             Auto the server picks from the span, because 365 daily bars is not
             a chart and three monthly bars is not a trend. -->
        <select id="fGrain" title="Group by">
          <option value="auto" selected>Auto grouping</option>
          <option value="">Exactly as asked (by day)</option>
          <option value="day">By day</option>
          <option value="week">By week</option>
          <option value="month">By month</option>
        </select>
        <select id="fPlatform" title="Platform">
          <option value="">All platforms</option>
          <option value="uber">Uber</option><option value="yango">Yango</option>
          <option value="bolt">Bolt</option>
          <option value="hotel">Hotel</option><option value="fms">FMS telematics</option>
        </select>
        <select id="fFleet" title="Fleet">
          <option value="">Both fleets</option>
          <option value="ecosine">Ecosine</option><option value="egari">Egari</option>
        </select>
        <button id="refreshBtn" title="Refresh">⟳</button>
        <!-- Every date and time on every page is Dubai's, including when the
             person reading this is not. Stated once here rather than repeated
             on forty panels, and it is a title so hovering gives the window. -->
        <span id="tzNote" class="tz-note" title=""></span>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="tt"></div>
<!-- The phone build mounts here. Empty and unstyled on desktop, where m.css is
     never loaded, so it cannot affect the layout above it. -->
<div id="m"></div>
</body>
</html>
